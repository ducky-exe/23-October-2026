<style>

 html:`<div class="orb"></div><p class="k">${N[0]} + ${N[1]}</p><h1 class="big grad">Love<br>Replay</h1><p class="k">2024 — 2026</p><p class="lead">Two years. A million memories. One love story.</p><button class="cta" id="go">TAP TO RELIVE US ♥</button>`,

const Mu={a:null,x:null,g:null,play:0,mute:0,syn:0,ch:-1},R=[1,1.122,1.26,1.335,.944,.841,1];
